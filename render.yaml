services:
  - type: web
    name: traveldb-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./traveldbBackend/Dockerfile
    dockerContext: ./traveldbBackend
    buildFilter:
      paths:
        - traveldbBackend/**
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: TRAVELDB_DATABASE_URL
        fromDatabase:
          name: traveldb-db
          property: connectionString
      - key: TRAVELDB_DATABASE_USERNAME
        fromDatabase:
          name: traveldb-db
          property: user
      - key: TRAVELDB_DATABASE_PASSWORD
        fromDatabase:
          name: traveldb-db
          property: password

databases:
  - name: traveldb-db
    plan: basic-256mb
    region: frankfurt
    databaseName: traveldb
    user: traveldb
    ipAllowList: []
