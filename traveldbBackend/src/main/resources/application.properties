spring.application.name=traveldbBackend
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.sql.init.data-locations=classpath:data/countries.sql,classpath:data/airlines.sql,classpath:data/airports.sql

# Journey checks never call a third-party requirements service. The backend
# evaluates this versioned, bundled snapshot entirely in-process. Updating the
# snapshot is a separate, explicit import workflow.
traveldb.documents.rules-location=classpath:data/document-rules.json
