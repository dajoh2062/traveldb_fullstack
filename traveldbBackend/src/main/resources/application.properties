spring.application.name=traveldb-backend
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,application/problem+json
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=${TRAVELDB_DATABASE_URL:jdbc:h2:mem:traveldb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${TRAVELDB_DATABASE_USERNAME:sa}
spring.datasource.password=${TRAVELDB_DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Reference data is inserted only when its tables are empty. Disable this in
# environments where countries and airports are managed outside the app.
traveldb.reference-data.bootstrap-enabled=${TRAVELDB_REFERENCE_DATA_BOOTSTRAP_ENABLED:true}
traveldb.reference-data.search-index-ttl=${TRAVELDB_REFERENCE_DATA_SEARCH_INDEX_TTL:PT5M}

# Journey checks never call a third-party requirements service. The backend
# evaluates this versioned, bundled snapshot entirely in-process. Updating the
# snapshot is a separate, explicit import workflow.
traveldb.documents.rules-location=classpath:data/document-rules.json
traveldb.documents.bootstrap-enabled=${TRAVELDB_DOCUMENT_RULES_BOOTSTRAP_ENABLED:true}
