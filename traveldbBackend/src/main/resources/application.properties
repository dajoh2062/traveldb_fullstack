spring.application.name=traveldb-backend
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,application/problem+json
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.data-locations=classpath:data/countries.sql,classpath:data/airports.sql

# Journey checks never call a third-party requirements service. The backend
# evaluates this versioned, bundled snapshot entirely in-process. Updating the
# snapshot is a separate, explicit import workflow.
traveldb.documents.rules-location=classpath:data/document-rules.json
