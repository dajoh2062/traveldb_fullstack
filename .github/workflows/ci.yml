name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: traveldbBackend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: traveldbBackend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Audit bundled document rules
        run: |
          node scripts/audit-document-rules.mjs --as-of "$(date -u +%F)"
          node --test scripts/document-rules-audit.test.mjs
      - name: Run backend tests
        run: ./mvnw -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: traveldbFrontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: traveldbFrontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run tests, lint, and production build
        run: npm run check
